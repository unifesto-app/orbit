name: CI

on:
  push:
    branches: [main, preprod]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The API's tests run on a real Postgres (api/src/testkit.ts).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t orbit-api:ci .
      - run: docker build -f web/Dockerfile -t orbit-web:ci .
      - run: docker build -f galaxy/Dockerfile -t orbit-galaxy:ci .
      - run: docker build -f console/Dockerfile -t orbit-console:ci .
