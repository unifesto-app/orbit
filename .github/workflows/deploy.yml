# Builds the API and web images and pushes them to GitHub Container Registry.
# Putting them on the AWS box (compose + Caddy) is a separate step, not done here.
name: Deploy images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push API image
        run: |
          docker build -f api/Dockerfile -t ghcr.io/unifesto-app/orbit-api:${{ github.sha }} -t ghcr.io/unifesto-app/orbit-api:latest .
          docker push ghcr.io/unifesto-app/orbit-api --all-tags
      - name: Push web image
        run: |
          docker build -f web/Dockerfile -t ghcr.io/unifesto-app/orbit-web:${{ github.sha }} -t ghcr.io/unifesto-app/orbit-web:latest .
          docker push ghcr.io/unifesto-app/orbit-web --all-tags
