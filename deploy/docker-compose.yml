# Orbit's app containers on the AWS box. Caddy is the Unifesto stack's: its Caddyfile
# routes heyorbit.in and its subdomains to these containers.
# Built on the box from the source that deploy/deploy.sh copies to ~/orbit/src.
# Runtime secrets live in env files on the server only (api.env, web.env, galaxy.env).
# Never commit them.

name: orbit

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The three Dockerfiles expect the whole repo as build context.
x-build-context: &repo
  context: ./src

services:
  # Container names match the Caddy upstreams in the Unifesto repo's Caddyfile
  # (orbit-api, orbit-web, orbit-galaxy). They join the Unifesto network so Caddy
  # can reach them; that network is created by the Unifesto stack.
  orbit-api:
    build:
      <<: *repo
      dockerfile: api/Dockerfile
    container_name: orbit-api
    restart: unless-stopped
    logging: *logging
    env_file: ./api.env
    environment:
      PORT: "3000"
    expose:
      - "3000"
    networks: [unifesto, orbit]
    depends_on: [orbit-redis]

  # Orbit's own Redis (Valkey): sign-in codes, rate limits and spent step tokens, every key with a TTL. Only the API
  # reaches it, on Orbit's private network; api.env has REDIS_URL=redis://orbit-redis:6379. Nothing in it outlives a
  # restart that matters (pending codes and counters), so it keeps no snapshot.
  orbit-redis:
    image: valkey/valkey:8.1-alpine
    container_name: orbit-redis
    restart: unless-stopped
    logging: *logging
    command: ["valkey-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl", "--save", "", "--appendonly", "no"]
    networks: [orbit]

  orbit-web:
    build:
      <<: *repo
      dockerfile: web/Dockerfile
    container_name: orbit-web
    restart: unless-stopped
    logging: *logging
    env_file: ./web.env
    expose:
      - "3000"
    networks: [unifesto]

  orbit-galaxy:
    build:
      <<: *repo
      dockerfile: galaxy/Dockerfile
    container_name: orbit-galaxy
    restart: unless-stopped
    logging: *logging
    env_file: ./galaxy.env
    expose:
      - "3000"
    networks: [unifesto]

networks:
  unifesto:
    external: true
    name: unifesto_default
  # Orbit's own, for the API and its Redis. Internal: nothing on it reaches out, and no other stack reaches in.
  orbit:
    internal: true
