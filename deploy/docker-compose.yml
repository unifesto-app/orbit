# Orbit's app containers on the AWS box. Caddy is the Unifesto stack's: its Caddyfile
# routes orbit.unifesto.app and its subdomains to these containers.
# Images come from GHCR (see .github/workflows/deploy.yml). Runtime secrets live in
# env files on the server only (api.env, web.env, galaxy.env). Never commit them.

name: orbit

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Container names match the Caddy upstreams in the Unifesto repo's Caddyfile
  # (orbit-api, orbit-web, orbit-galaxy). They join the Unifesto network so Caddy
  # can reach them; that network is created by the Unifesto stack.
  orbit-api:
    image: ghcr.io/unifesto-app/orbit-api:latest
    container_name: orbit-api
    restart: unless-stopped
    logging: *logging
    env_file: ./api.env
    environment:
      PORT: "3000"
    expose:
      - "3000"
    networks: [unifesto]

  orbit-web:
    image: ghcr.io/unifesto-app/orbit-web:latest
    container_name: orbit-web
    restart: unless-stopped
    logging: *logging
    env_file: ./web.env
    expose:
      - "3000"
    networks: [unifesto]

  orbit-galaxy:
    image: ghcr.io/unifesto-app/orbit-galaxy:latest
    container_name: orbit-galaxy
    restart: unless-stopped
    logging: *logging
    env_file: ./galaxy.env
    expose:
      - "3000"
    networks: [unifesto]

networks:
  unifesto:
    external: true
    name: unifesto_default
