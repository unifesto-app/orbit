# Orbit's stack on its own server, orbit-server (no tie to Unifesto's box, network or Caddy).
# Caddy (deploy/Caddyfile) serves heyorbit.in, www., api. and galaxy. with the Cloudflare origin cert in ./certs.
# Built on the box from the source that deploy/deploy.sh copies to ~/orbit/src.
# Runtime secrets live in env files on the server only (api.env, web.env, galaxy.env) and so does ./certs.
# Never commit them.

name: orbit

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The three Dockerfiles expect the whole repo as build context.
x-build-context: &repo
  context: ./src

services:
  # The only published port. The security group admits 443 from Cloudflare's ranges only, and Caddy
  # refuses any TLS client without Cloudflare's origin-pull certificate.
  caddy:
    image: caddy:2-alpine
    container_name: orbit-caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [orbit-api, orbit-web, orbit-galaxy]

  # Container names are Caddy's upstreams (orbit-api, orbit-web, orbit-galaxy).
  orbit-api:
    build:
      <<: *repo
      dockerfile: api/Dockerfile
    container_name: orbit-api
    restart: unless-stopped
    logging: *logging
    env_file: ./api.env
    environment:
      PORT: "3000"
    expose:
      - "3000"
    networks: [edge, orbit]
    depends_on: [orbit-redis]
    # Photo uploads decode one at a time (api/src/media.ts), each up to about 160 MB, over the API's own couple of
    # hundred. The cap keeps an out-of-memory kill to the API alone, never Caddy, web or Galaxy on the 4 GB box.
    mem_limit: 1g

  # Orbit's own Redis (Valkey): sign-in codes, rate limits, spent step tokens and attested iPhone keys, every key with a
  # TTL. Only the API reaches it, on Orbit's private network; api.env has REDIS_URL=redis://orbit-redis:6379. Nothing in
  # it outlives a restart that matters (pending codes and counters; phones attest their keys again), so it keeps no
  # snapshot.
  orbit-redis:
    image: valkey/valkey:8.1-alpine
    container_name: orbit-redis
    restart: unless-stopped
    logging: *logging
    command: ["valkey-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl", "--save", "", "--appendonly", "no"]
    networks: [orbit]

  orbit-web:
    build:
      <<: *repo
      dockerfile: web/Dockerfile
    container_name: orbit-web
    restart: unless-stopped
    logging: *logging
    env_file: ./web.env
    expose:
      - "3000"
    networks: [edge]

  orbit-galaxy:
    build:
      <<: *repo
      dockerfile: galaxy/Dockerfile
    container_name: orbit-galaxy
    restart: unless-stopped
    logging: *logging
    env_file: ./galaxy.env
    environment:
      # Galaxy's server calls the API directly on `edge`, not through Caddy, and passes on the visitor's address
      # (galaxy/src/session.ts).
      ORBIT_API_URL: http://orbit-api:3000
    expose:
      - "3000"
    networks: [edge]

networks:
  # Caddy and the apps. A plain bridge: the apps reach out through it (Postgres on RDS, SES, WhatsApp).
  edge:
  # Orbit's own, for the API and its Redis. Internal: nothing on it reaches out, and no other stack reaches in.
  orbit:
    internal: true

volumes:
  caddy_data:
  caddy_config:
