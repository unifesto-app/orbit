packages:
  - contract
  - tokens
  - api
  - web
  - app
  - host
  - mobile
  - galaxy
  - console

patchedDependencies:
  expo-modules-autolinking@58.1.0: patches/expo-modules-autolinking@58.1.0.patch

# Expo SDK 58 pins react-native-worklets to 0.13.0 (expo/bundledNativeModules.json). Without this, the
# expo-router copy that @expo/cli pulls in resolves its own 0.13.1, and two Worklets copies break at runtime.
overrides:
  react-native-worklets: 0.13.0
  # drizzle-orm lists expo-sqlite as an optional peer, and pnpm wires it to the app's copy, so the API's install pulled
  # in React Native and Expo (about 500 MB in the API image). The API never uses it.
  drizzle-orm>expo-sqlite: "-"

# @sentry/cli's install script only downloads a fallback binary; the real one comes in @sentry/cli-darwin (an optional
# dependency), so skipping it is safe and stops pnpm asking on every install.
ignoredBuiltDependencies:
  - '@sentry/cli'
